name: CI

# Why this exists (audit findings C-3 and C-6):
# * `main` shipped with an undeclared identifier in App.tsx, so `npm run
#   build` failed. Nothing caught it because nothing ran the build.
# * The deployed site had drifted from the repo, because edits were made in
#   the Bolt host and never pushed back. A green build on every push makes
#   the divergence visible instead of silent.
#
# Keep this fast. A slow pipeline during a campaign gets bypassed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  static-site:
    name: Validate public campaign site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML structure
        run: npx --yes html-validate public/*.html --rule no-inline-style:off --rule no-implicit-button-type:off

      - name: Assert no internal documents are published
        # Audit finding H-7: internal targeting strategy and comms scripts were
        # being served from the public campaign domain. Fail the build if any
        # markdown reappears under public/.
        run: |
          if find public -name '*.md' | grep -q .; then
            echo "::error::Markdown found under public/ — internal documents must live in docs/, not on the public site."
            find public -name '*.md'
            exit 1
          fi
          echo "No internal documents under public/ — OK"

  secrets-scan:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on service-role keys or .env files
        run: |
          set -e
          if git ls-files | grep -E '^\.env$|^\.env\.(local|production)$'; then
            echo "::error::An .env file is committed. Remove it and rotate every key it contained."
            exit 1
          fi
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude='.env.example' \
              -e 'service_role' -e 'sb_secret_' -e 'SUPABASE_SERVICE_ROLE_KEY=' . \
              | grep -v 'supabase/functions/' \
              | grep -v '\.github/workflows/'; then
            echo "::error::Possible service-role key outside the Edge Function. Review the matches above."
            exit 1
          fi
          echo "No committed secrets detected — OK"

  static-js:
    name: Syntax-check static site JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check standalone scripts parse
        run: |
          set -e
          for f in public/assets/*.js; do
            node --check "$f"
            echo "OK $f"
          done

      - name: Check inline scripts parse
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          let bad = 0, n = 0;
          for (const f of fs.readdirSync('public').filter(x => x.endsWith('.html'))) {
            const s = fs.readFileSync('public/' + f, 'utf8');
            for (const m of s.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/g)) {
              const attrs = m[1], code = m[2];
              if (/\bsrc=/.test(attrs) || !code.trim()) continue;
              if (/json/i.test(attrs)) { try { JSON.parse(code) } catch (e) { bad++; console.log('JSON ERR', f, e.message) } continue }
              n++;
              try { new Function(code) } catch (e) { bad++; console.log('JS ERR', f, e.message) }
            }
          }
          console.log(n + ' inline scripts checked');
          if (bad) process.exit(1);
          "

      # ARCHITECTURAL NOTE (2026-08-21):
      # scripts/sync-chrome.mjs was removed in August 2026 per the README.
      # Nav, footer, runtime config and script tags are now hand-maintained.
      # A generator that cannot run is worse than no generator.
      # See: README.md → "Keeping 22 pages consistent"
      #
      # - name: Chrome is in sync across all pages
      #   run: node scripts/sync-chrome.mjs --check

      - name: Internal links resolve
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          let broken = 0, checked = 0;
          for (const f of fs.readdirSync('public').filter(x => x.endsWith('.html'))) {
            const s = fs.readFileSync('public/' + f, 'utf8');
            for (const m of s.matchAll(/(?:href|src)=\\\"([^\\\"]+)\\\"/g)) {
              const u = m[1];
              if (/^(https?:|mailto:|tel:|data:|#)/.test(u)) continue;
              const path = u.split('#')[0].split('?')[0];
              if (!path) continue;
              checked++;
              if (!fs.existsSync('public/' + path)) { broken++; console.log('BROKEN', f, '->', u); }
            }
          }
          console.log(checked + ' internal refs checked');
          if (broken) process.exit(1);
          "

      - name: FAQ structured data matches visible copy
        # Schema describing content a visitor cannot see is a manual-action
        # risk. Every FAQPage question must exist as a <details> on the page.
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          let issues = 0;
          for (const f of fs.readdirSync('public').filter(x => x.endsWith('.html'))) {
            const s = fs.readFileSync('public/' + f, 'utf8');
            const m = s.match(/<script type=\"application\\/ld\\+json\">([\\s\\S]*?)<\\/script>/);
            if (!m) continue;
            let json;
            try { json = JSON.parse(m[1]); } catch (e) { continue; }
            if (json['@type'] !== 'FAQPage') continue;
            const details = [...s.matchAll(/<details[^>]*>\\s*<summary>([^<]+)<\\/summary>/g)].map(x => x[1].trim());
            for (const q of json.mainEntity || []) {
              const question = q.name?.trim();
              if (!details.includes(question)) {
                console.log('FAQ MISMATCH', f, '- schema question not in visible HTML:', question);
                issues++;
              }
            }
          }
          if (issues) process.exit(1);
          console.log('FAQ structured data matches visible copy — OK');
          "

      - name: Widget CSS and JS are paired on every page
        # Audit finding: cookie banner went missing from a page that collects
        # personal data because site-widgets.css was present but site-widgets.js
        # was not. Enforce pairing.
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          let bad = 0;
          for (const f of fs.readdirSync('public').filter(x => x.endsWith('.html'))) {
            const s = fs.readFileSync('public/' + f, 'utf8');
            const hasCss = s.includes('site-widgets.css');
            const hasJs = s.includes('site-widgets.js');
            if (hasCss !== hasJs) {
              console.log('WIDGET MISMATCH', f, 'CSS:', hasCss, 'JS:', hasJs);
              bad++;
            }
          }
          if (bad) process.exit(1);
          console.log('Widget CSS/JS paired on all pages — OK');
          "

      - name: Widget JS is JavaScript, not a copy of the stylesheet
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          const js = fs.readFileSync('public/assets/site-widgets.js', 'utf8');
          if (js.includes('{') && js.includes('function')) {
            console.log('site-widgets.js is JavaScript — OK');
          } else {
            console.log('::error::site-widgets.js looks like CSS, not JS');
            process.exit(1);
          }
          "

      - name: Every page carries pbb-hide-host-badge.js
        # The host badge (e.g. Bolt, Vercel) must be hidden on all public pages.
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          let bad = 0;
          for (const f of fs.readdirSync('public').filter(x => x.endsWith('.html'))) {
            const s = fs.readFileSync('public/' + f, 'utf8');
            if (!s.includes('pbb-hide-host-badge.js')) {
              console.log('MISSING HOST BADGE HIDER', f);
              bad++;
            }
          }
          if (bad) process.exit(1);
          console.log('Host badge hider present on all pages — OK');
          "

      - name: Form controllers carry readiness guard
        # If a form controller fails to load, the button must say so instead of
        # leaving every button inert.
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          let bad = 0;
          for (const f of ['membership.html', 'volunteer.html', 'partnership.html']) {
            const s = fs.readFileSync('public/' + f, 'utf8');
            if (s.includes('join.js') && !s.includes('data-readiness-guard')) {
              console.log('MISSING READINESS GUARD', f);
              bad++;
            }
          }
          if (bad) process.exit(1);
          console.log('Form readiness guards present — OK');
          "

      - name: Campaign figures are in sync
        # scripts/sync-figures.mjs still manages the campaign figures.
        run: |
          node scripts/sync-figures.mjs --check

      - name: PWA assets are present and internally consistent
        run: |
          set -e
          test -f public/manifest.json || { echo '::error::manifest.json missing'; exit 1; }
          test -f public/sw.js || { echo '::error::sw.js missing'; exit 1; }
          node --input-type=module -e "
          import fs from 'fs';
          const m = JSON.parse(fs.readFileSync('public/manifest.json', 'utf8'));
          if (!m.icons || m.icons.length === 0) { console.log('::error::manifest.json missing icons'); process.exit(1); }
          for (const icon of m.icons) {
            if (!fs.existsSync('public/' + icon.src)) {
              console.log('::error::manifest icon missing:', icon.src);
              process.exit(1);
            }
          }
          console.log('PWA assets consistent — OK');
          "

      - name: Service worker never caches authenticated or write paths
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          const sw = fs.readFileSync('public/sw.js', 'utf8');
          const forbidden = ['/functions/v1/submit-lead', '/functions/v1/verify-member', '/auth'];
          let bad = 0;
          for (const path of forbidden) {
            if (sw.includes(path)) {
              console.log('::error::Service worker references sensitive path:', path);
              bad++;
            }
          }
          if (bad) process.exit(1);
          console.log('Service worker guards OK');
          "

      - name: PWA tags are on every page
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          let bad = 0;
          for (const f of fs.readdirSync('public').filter(x => x.endsWith('.html'))) {
            const s = fs.readFileSync('public/' + f, 'utf8');
            if (!s.includes('manifest.json')) { console.log('MANIFEST MISSING', f); bad++; }
            if (!s.includes('theme-color')) { console.log('THEME-COLOR MISSING', f); bad++; }
          }
          if (bad) process.exit(1);
          console.log('PWA tags present on all pages — OK');
          "

      - name: No retired host origins remain in Edge Function allowlists
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          const fn = fs.readFileSync('supabase/functions/submit-lead/index.ts', 'utf8');
          const retired = ['localhost:3000', 'bolt.new', 'stackblitz'];
          let bad = 0;
          for (const host of retired) {
            if (fn.includes(host)) {
              console.log('::error::Retired host in allowlist:', host);
              bad++;
            }
          }
          if (bad) process.exit(1);
          console.log('No retired hosts in allowlist — OK');
          "

      - name: Card payload is never persisted to browser storage
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          const js = fs.readFileSync('public/assets/pbb-id.js', 'utf8');
          if (js.includes('localStorage') || js.includes('sessionStorage')) {
            console.log('::error::pbb-id.js uses browser storage — card payload must not persist');
            process.exit(1);
          }
          console.log('Card payload not persisted — OK');
          "

      - name: Card endpoints keep their no-store and origin guards
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          const fn = fs.readFileSync('supabase/functions/verify-member/index.ts', 'utf8');
          if (!fn.includes('no-store')) {
            console.log('::error::verify-member missing no-store header');
            process.exit(1);
          }
          if (!fn.includes('origin')) {
            console.log('::error::verify-member missing origin guard');
            process.exit(1);
          }
          console.log('Card endpoint guards OK');
          "
