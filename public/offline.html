<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063D1B">
<meta name="robots" content="noindex, nofollow">
<title>Walang koneksyon — Partido Bangon Bangsamoro</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="stylesheet" href="assets/pbb-tokens.css">
<style>
  /* Self-contained on purpose: this page must render from cache even when
     the network is gone, so it depends on nothing but pbb-tokens.css. */
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-content: center;
    gap: var(--pbb-space-4, 1rem);
    padding: var(--pbb-space-6, 1.5rem);
    text-align: center;
    background: var(--pbb-forest-deep, #063D1B);
    color: var(--pbb-ink, #EAF1EC);
    font-family: var(--pbb-font-body, system-ui, sans-serif);
  }
  img { width: 96px; height: 96px; margin-inline: auto; }
  h1 {
    margin: 0;
    font-family: var(--pbb-font-head, system-ui, sans-serif);
    font-size: 1.5rem;
    color: var(--pbb-gold-bright, #F7DE8E);
  }
  p { margin: 0; max-width: 34ch; margin-inline: auto; line-height: 1.55; }
  a.retry {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: var(--pbb-tap, 48px);
    padding: 0 var(--pbb-space-6, 1.5rem);
    border-radius: var(--pbb-radius, 10px);
    background-image: var(--pbb-gold-metal, linear-gradient(180deg, #F7DE8E, #D9AF33 55%, #8B6914));
    color: var(--pbb-ink-dark, #12210F);
    font-family: var(--pbb-font-label, system-ui, sans-serif);
    font-weight: 700;
    text-decoration: none;
  }
  a.retry:focus-visible { outline: 2px solid var(--pbb-gold-bright, #F7DE8E); outline-offset: 3px; }
</style>
</head>
<body>
  <img src="assets/pwa-icon-192.png" alt="Partido Bangon Bangsamoro">
  <h1>Walang koneksyon sa internet</h1>
  <p>Hindi ma-load ang pahinang ito ngayon. Subukan ulit kapag may signal na — nandito lang kami.</p>
  <a class="retry" href="/">Subukan Ulit</a>
</body>
</html>
