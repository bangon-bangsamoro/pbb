# =============================================================================
# Netlify configuration — Partido Bangon Bangsamoro
# =============================================================================
#
# This repository holds TWO sites that share one build:
#
#   public/*.html   the 22-page campaign site — the thing voters see
#   src/            the INFORM/ACAPS risk dashboard (React + Vite)
#
# `vite build` emits both into dist/: the dashboard becomes dist/index.html,
# and everything in public/ is copied to the root of dist/ untouched.
#
# THE ROOT PATH IS THE ONE DECISION THAT MATTERS HERE
#
# Left alone, "/" serves index.html — the internal dashboard. That is exactly
# what pbb.bolt.host does today, and it means a voter who follows a link from
# a poster or a boosted post lands on an internal data tool. The rewrite below
# gives "/" to home.html and moves the dashboard to /inform.
#
# Nothing is hidden by that move: /inform is a normal URL and the dashboard
# still enforces its own login. It is about what the public domain leads with.
# =============================================================================

[build]
  command  = "npm run build"
  publish  = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Vite only exposes VITE_-prefixed variables to the bundle. Set
  # VITE_ACAPS_API_URL and VITE_USE_MOCK_DATA in the Netlify UI, not here —
  # this file is committed and anything written in it is public.
  NPM_FLAGS = "--no-audit --no-fund"

# -----------------------------------------------------------------------------
# Routing
# -----------------------------------------------------------------------------
# Order matters: Netlify applies the first matching rule.

# The campaign site owns the front door.
#
# force = true IS LOAD-BEARING, and leaving it out was a real bug: the live
# site served the INFORM dashboard at "/" even with this rule in place.
# Netlify does not apply a 200 rewrite when a file already exists at the
# requested path — "by default, you can't shadow a URL that actually exists
# within the site". "/" resolves to dist/index.html, which vite build emits
# for the dashboard, so the existing file won and this rule never fired.
# force = true is the documented override.
[[redirects]]
  from   = "/"
  to     = "/home.html"
  status = 200          # rewrite, not a 301 — the URL stays bangonbangsamoro.com/
  force  = true         # without this, dist/index.html shadows the rewrite

# The dashboard, explicitly addressed. No force needed here — nothing exists
# at /inform, so there is no file to shadow.
[[redirects]]
  from   = "/inform"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/inform/*"
  to     = "/index.html"
  status = 200

# ACAPS proxy, mirroring the Vite dev-server proxy in vite.config.ts so the
# browser makes a same-origin request in production too.
#
# READ THIS BEFORE RELYING ON IT: a Netlify redirect cannot attach a secret
# header. If the ACAPS token must stay server-side, this rule is not enough —
# replace it with a Netlify Function that injects the token and proxies on.
# As written it only solves CORS, not credential exposure.
[[redirects]]
  from   = "/api/acaps/*"
  to     = "https://api.acaps.org/:splat"
  status = 200
  force  = true

# Deliberately NOT redirecting /index.html → /inform. Paired with the
# /inform → /index.html rewrite above it forms a loop risk, and Netlify
# already normalises /index.html to / on its own.

# -----------------------------------------------------------------------------
# Security headers
# -----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

    # camera=(self) is REQUIRED, not an oversight. membership.html captures a
    # member photo with getUserMedia for the ID card; a blanket camera=()
    # silently kills that flow with no error a volunteer could interpret.
    # Everything else the site never asks for is switched off.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()"

    # Content-Security-Policy
    #
    #   'unsafe-inline' in script-src is load-bearing and cannot be dropped
    #   without reworking the pages: every page carries an inline JSON-LD
    #   block and the inline window.PBB_* configuration block that
    #   sync-chrome.mjs writes. Hashing 22 pages' worth of inline script is
    #   possible but would have to be generated at build time and kept in
    #   step; until that exists, saying 'unsafe-inline' honestly is better
    #   than shipping a policy that quietly blocks the config block and
    #   breaks every form.
    #
    #   connect-src covers Supabase (submit-lead + verify-member Edge
    #   Functions) and the same-origin ACAPS proxy above. Narrow
    #   https://*.supabase.co to the project's own subdomain once it is
    #   known — the wildcard permits any Supabase project.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co https://*.supabase.in; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; upgrade-insecure-requests"

# -----------------------------------------------------------------------------
# Caching
# -----------------------------------------------------------------------------
# The usual advice — cache /assets/* for a year, immutable — is WRONG for this
# repository, and would be the single most expensive mistake in this file.
#
# dist/assets/ ends up holding two different kinds of file:
#   * Vite's bundles, content-hashed (index-a1b2c3d4.js) — safe to freeze.
#   * The campaign site's hand-written scripts and stylesheets, which keep
#     stable names (pbb-app.js, pbb-tokens.css, site-widgets.js).
#
# Freezing the second group means a fix pushed mid-campaign never reaches a
# returning visitor for up to a year, with no way to bust it short of renaming
# every file. During a 30-day campaign, correctness beats a cache score.

# HTML: always revalidate. Content changes daily.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hand-written site scripts and styles: short cache, revalidate in background.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"

# Generated responsive images. Content-addressed by name and width, and
# regenerated only when the source art changes.
[[headers]]
  for = "/assets/images/derived/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Logos and favicon.
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# -----------------------------------------------------------------------------
# Deploy previews
# -----------------------------------------------------------------------------
# Keep previews and branch builds out of search results. A staging copy of a
# campaign site competing with the real one in search is a self-inflicted SEO
# problem, and previews may carry unreleased policy copy.

[context.deploy-preview]
  command = "npm run build"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  command = "npm run build"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
